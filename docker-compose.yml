services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: leitura
      POSTGRES_PASSWORD: leitura
      POSTGRES_DB: leitura
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leitura -d leitura"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Perfil "full": sobe API e worker em containers (em dev o normal é `pnpm dev` no host).
  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgres://leitura:leitura@postgres:5432/leitura
      STORAGE_DIR: /data/storage
      # Dentro do container a API precisa escutar em todas as interfaces; quem limita o acesso é a
      # publicação da porta abaixo (somente em 127.0.0.1).
      API_HOST: 0.0.0.0
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    profiles: ["full"]
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      DATABASE_URL: postgres://leitura:leitura@postgres:5432/leitura
      STORAGE_DIR: /data/storage
    env_file: .env
    volumes:
      - ./storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
